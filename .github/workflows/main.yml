name: Retrain ML App

on:
  push:
    branches: [ main, bee ]
  schedule:
    - cron: '0 8 * * 2'  # Every Tuesday at 8 AM UTC
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

permissions:
  contents: write  # needed to push the retrained model

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ------------------------
      # Run data scraper
      # ------------------------
      - name: Run data scraper
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          API_KEY: ${{ secrets.API_KEY }}
          # Update when a new season starts; the free API tier allows recent seasons
          SEASONS: 2024,2025,2026
        run: python data_scraped_storage.py

      # ------------------------
      # Retrain the ML model
      # ------------------------
      # Trains on data/matches_data.csv written by the scraper step above
      - name: Retrain model
        run: python train.py

      # ------------------------
      # Commit and push the updated model
      # ------------------------
      - name: Commit and push new model
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add model.json
          git commit -m "Auto retrain model on schedule" || echo "No changes to commit"
          git push
